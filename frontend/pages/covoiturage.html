<div class="hero-scene text-center text-white">
    <div class="text-center hero-scene-content">
        <h1>Covoiturage</h1>
    </div>
</div>

<section class="Recherche">
    <article>
        <div class="container mt-5">
            <h2>Rechercher un trajet</h2>
            <form class="row g-3">
                <div class="col-md-2">
                    <label for="depart" class="form-label">Départ</label>
                    <input type="text" class="form-control" id="depart" placeholder="Ville de départ">
                </div>
                <div class="col-md-2">
                    <label for="arrivee" class="form-label">Arrivée</label>
                    <input type="text" class="form-control" id="arrivee" placeholder="Ville d'arrivée">
                </div>
                <div class="col-md-2">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" placeholder="Date de départ">
                </div>
                <div class="col-md-2 align-self-end">
                    <button type="submit" class="btn btn-primary w-100">Rechercher</button>
                </div>
            </form>
        </div>
    </article>    
</section>

<section>
    <div class="container mt-5">
        <h2>Résultats de la recherche</h2>
        <p>Aucun résultat trouvé pour le moment. Veuillez réessayer plus tard.</p>
    </div>
</section>
